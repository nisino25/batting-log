<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111310" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="バッティング記録">
  <title>バッティングマシン記録</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg?v=4" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=4">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=4">
  <style>
    /* 色はすべてトークン。ライトを基本に、ダークで上書き。 */
    :root {
      color-scheme: light;
      --bg: #f3f2ee;
      --card: #fffffe;
      --fg: #1c2019;
      --muted: #6c7269;
      --line: #e3e2db;
      --tile: #f3f2ee;
      --hit: #1d7a4b;
      --on-hit: #ffffff;
      --hr: #a86f00;
      --on-hr: #ffffff;
      --danger: #b4412c;
      --accent-soft: #dcefe4;
      --warn-soft: #f7ecd2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #111310;
        --card: #1a1d19;
        --fg: #ebeae4;
        --muted: #9ca296;
        --line: #2c3029;
        --tile: #111310;
        --hit: #4fc38a;
        --on-hit: #0f1410;
        --hr: #f0b84a;
        --on-hr: #1a1300;
        --danger: #ec7f67;
        --accent-soft: #1f3a2c;
        --warn-soft: #3a2f14;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111310;
      --card: #1a1d19;
      --fg: #ebeae4;
      --muted: #9ca296;
      --line: #2c3029;
      --tile: #111310;
      --hit: #4fc38a;
      --on-hit: #0f1410;
      --hr: #f0b84a;
      --on-hr: #1a1300;
      --danger: #ec7f67;
      --accent-soft: #1f3a2c;
      --warn-soft: #3a2f14;
    }

    /* ダブルタップでの拡大を無効化（ピンチ拡大は残す） */
    * { touch-action: manipulation; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding-top: 20px;
      padding-bottom: 32px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .head h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: 0.02em; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    h2 { font-size: 17px; margin: 0; }

    /* タブ */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .tab {
      font: inherit;
      font-weight: 700;
      padding: 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tab.on { background: var(--bg); color: var(--fg); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .muted { color: var(--muted); font-size: 13px; }

    /* 球数・球速の切り替え */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .seg-btn {
      font: inherit;
      font-weight: 600;
      padding: 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .seg-btn.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

    .spd-row { display: flex; flex-direction: column; gap: 8px; }
    .spd-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .spd-btn {
      font: inherit;
      font-weight: 700;
      padding: 10px 0;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .spd-btn.on { background: var(--fg); border-color: var(--fg); color: var(--card); }

    /* ヒット数・HR数のカウンター */
    .counters { display: flex; flex-direction: column; gap: 10px; }
    .counter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--tile);
      border-radius: 14px;
      padding: 12px;
    }
    .counter-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .counter-label strong { font-size: 17px; }
    .counter-label span { font-size: 12px; color: var(--muted); }
    .stepper { display: flex; align-items: center; gap: 10px; flex: none; }
    .step {
      width: 60px;
      height: 60px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 30px;
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--fg);
      cursor: pointer;
      user-select: none;
    }
    .step.plus { background: var(--hit); border-color: var(--hit); color: var(--on-hit); }
    .step:active { transform: scale(0.95); }
    .step:disabled { opacity: 0.35; cursor: default; transform: none; }
    .step-v {
      min-width: 56px;
      text-align: center;
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { background: var(--tile); border-radius: 12px; padding: 10px 6px; text-align: center; }
    .stat-v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .stat-l { font-size: 12px; color: var(--muted); }

    .btn-row { display: flex; gap: 8px; }
    .ghost {
      flex: 1;
      font: inherit;
      font-size: 14px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    .ghost.armed { border-color: var(--danger); color: var(--danger); font-weight: 700; }
    .ghost:disabled { opacity: 0.4; cursor: default; }

    .note {
      font: inherit;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
    }
    .save {
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--fg);
      color: var(--card);
      cursor: pointer;
    }
    .save:disabled { opacity: 0.35; cursor: default; }
    .msg { margin: 0; min-height: 1.3em; font-size: 14px; color: var(--muted); text-align: center; }

    .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .today { background: var(--tile); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .empty { color: var(--muted); margin: 0; }
    .list { list-style: none; margin: 0; padding: 0; }
    .item { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
    .score { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .item-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .item-note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .del {
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      margin-left: auto;
    }
    .del.armed { border-color: var(--danger); color: var(--danger); font-weight: 700; }
    .store-note { font-size: 12px; color: var(--muted); margin: 0; }

    /* アドバイス（確認リスト） */
    .progress { display: flex; flex-direction: column; gap: 6px; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    .count { font-variant-numeric: tabular-nums; font-weight: 700; }
    .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--hit); transition: width 0.2s ease; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .card-head .tag { font-size: 12px; color: var(--muted); }
    .adv-item {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px 4px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      min-width: 0;
    }
    .adv-item:first-of-type { border-top: 0; }
    .adv-item input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--hit); cursor: pointer; }
    .adv-item .t { font-weight: 600; overflow-wrap: anywhere; }
    .adv-item .d { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
    .adv-item:has(input:checked) .t { color: var(--muted); text-decoration: line-through; }
    .point { border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); font-size: 14px; overflow-wrap: anywhere; }
    .point strong { color: var(--hit); }
    .warn { border-radius: 12px; padding: 12px 14px; background: var(--warn-soft); font-size: 14px; overflow-wrap: anywhere; }
    .src { font-size: 12px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="jp-holiday.js"></script>
<script>
  const { createApp, ref, computed, onMounted, onBeforeUnmount } = Vue;

  // ---- 保存（いまはこのブラウザ内）---------------------------------------
  // 将来クラウドのDBに変えるときは list / add / remove の中身だけ差し替える。
  const Store = {
    KEY: 'batting-log-rounds',
    async list() {
      let rows;
      try { rows = JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch (e) { rows = []; }
      // 初期版の H / M 形式を 1 / 0 に読み替える
      return rows.map(r => (r.pattern ? { ...r, pattern: r.pattern.replace(/H/g, '1').replace(/M/g, '0') } : r));
    },
    async add(row) {
      const rows = await this.list();
      const item = { id: String(Date.now()) + Math.random().toString(36).slice(2, 7), ...row };
      rows.push(item);
      localStorage.setItem(this.KEY, JSON.stringify(rows));
      return item;
    },
    async remove(id) {
      const rows = (await this.list()).filter(r => r.id !== id);
      localStorage.setItem(this.KEY, JSON.stringify(rows));
      return rows;
    },
  };

  // ---- アドバイス（右打ちの確認リスト）-----------------------------------
  const ADVICE_KEY = 'batting-checklist-v1';
  const ADVICE = [
    {
      title: '1. 持ち方（右打ち）', tag: '上の手＝左手 ／ 下の手＝右手',
      items: [
        { k: 'grip-1', t: '上の手（左手）は指で握る', d: '手のひら全体でガシッと握らない。指の関節で握るイメージ。' },
        { k: 'grip-2', t: '上の手の親指と人差し指のV字は、後ろの肩（右肩）を指す', d: 'V字の向きがずれると、スイングの軌道もずれやすくなります。' },
        { k: 'grip-3', t: '上の手の関節がそろっている', d: '指の付け根（ナックル）が一直線になるように並べます。' },
        { k: 'grip-4', t: '下の手（右手）は上の手に隙間なく重ねる', d: '両手の間が空くと、バットがぶれやすくなります。' },
        { k: 'grip-5', t: '力は抜いて持つ', d: '傘をさすような軽い感じで持ちます。力みは振りを遅くします。' },
      ],
    },
    {
      title: '2. 構え', tag: '最初の一球前に',
      items: [
        { k: 'stance-1', t: '手の位置は肩の高さあたり', d: '構えの最初は、手を肩の高さに置いて力を抜いて待ちます。' },
        { k: 'stance-2', t: '足は少し開く', d: '開きすぎると体が動きにくくなります。' },
        { k: 'stance-3', t: '足は上げずに振る', d: '最初は足を上げず、地面に着いたまま振るのがおすすめです。' },
      ],
    },
    {
      title: '3. 振り終わり', tag: '毎球',
      items: [
        { k: 'swing-1', t: '振った後に体がヨロヨロしない', d: '振り抜いたら、その場でピタッと止まる意識を持ちます。' },
      ],
    },
  ];
  const ADVICE_TOTAL = ADVICE.reduce((n, g) => n + g.items.length, 0);

  function loadChecks() {
    try { return JSON.parse(localStorage.getItem(ADVICE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveChecks(s) {
    try { localStorage.setItem(ADVICE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  // ---- 球速（km/h）。最後に選んだ速度を次回も使う -------------------------
  const SPEEDS = [80, 90, 100, 110, 120];
  const SPEED_KEY = 'batting-log-speed';
  function loadSpeed() {
    try {
      const v = Number(localStorage.getItem(SPEED_KEY));
      return SPEEDS.includes(v) ? v : 100;
    } catch (e) { return 100; }
  }
  function storeSpeed(v) {
    try { localStorage.setItem(SPEED_KEY, String(v)); } catch (e) {}
  }

  // ---- 集計 -----------------------------------------------------------------
  // 新しい記録は pitches / hits / homeRuns を持つ。
  // 以前のマス目形式（pattern）の記録も読めるように、そちらも対応する。
  function rowStats(r) {
    if (r.pattern) {
      const s = r.pattern.split('');
      const homeRuns = s.filter(c => c === '2').length;
      const hits = s.filter(c => c === '1' || c === '2').length;
      const pitches = s.length;
      return { pitches, hits, homeRuns, rate: pitches ? Math.round((hits / pitches) * 100) : 0 };
    }
    const pitches = r.pitches || 0;
    const hits = r.hits || 0;
    const homeRuns = r.homeRuns || 0;
    return { pitches, hits, homeRuns, rate: pitches ? Math.round((hits / pitches) * 100) : 0 };
  }
  function sumStats(list) {
    const t = list.reduce((a, r) => {
      const s = rowStats(r);
      return { p: a.p + s.pitches, h: a.h + s.hits, n: a.n + 1 };
    }, { p: 0, h: 0, n: 0 });
    return { rounds: t.n, rate: t.p ? Math.round((t.h / t.p) * 100) : 0, pitches: t.p, hits: t.h };
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function dayReason(date) {
    if (JpHoliday.isJpHoliday(date)) return '祝日なので20球';
    const w = date.getDay();
    if (w === 0 || w === 6) return '週末なので20球';
    return '平日なので25球';
  }
  function buzz() {
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
  }

  createApp({
    setup() {
      const tab = ref('record');        // record | advice
      const today = new Date();
      const size = ref(JpHoliday.defaultRoundSize(today));
      const reason = dayReason(today);
      const speed = ref(loadSpeed());
      const hits = ref(0);              // ヒット数（HRを含む）
      const homeRuns = ref(0);          // うちホームラン
      const note = ref('');
      const rounds = ref([]);
      const loadState = ref('loading'); // loading | ready | error
      const saving = ref(false);
      const msg = ref('');
      const armed = ref(null);          // 2回押しで実行する操作の目印
      let armTimer = null;

      // アドバイス側の状態
      const checks = ref(loadChecks());
      const checkDone = computed(() => ADVICE.reduce((n, g) => n + g.items.filter(it => checks.value[it.k]).length, 0));
      const checkPct = computed(() => (ADVICE_TOTAL ? Math.round((checkDone.value / ADVICE_TOTAL) * 100) : 0));
      function toggleCheck(k) {
        checks.value = { ...checks.value, [k]: !checks.value[k] };
        saveChecks(checks.value);
      }
      function resetChecks() {
        checks.value = {};
        saveChecks({});
        msg.value = 'チェックをリセットしました';
      }

      const cur = computed(() => {
        const rate = size.value ? Math.round((hits.value / size.value) * 100) : 0;
        return { hits: hits.value, homeRuns: homeRuns.value, singles: hits.value - homeRuns.value, rate };
      });
      const overall = computed(() => sumStats(rounds.value));
      const todayTotal = computed(() => sumStats(rounds.value.filter(r => sameDay(new Date(r.playedAt), new Date()))));
      const canSave = computed(() => !saving.value && loadState.value === 'ready');

      // 1回目は「もう一度で実行」の表示にし、3秒以内の2回目で実行する
      function confirmTap(key, action) {
        if (armed.value !== key) {
          armed.value = key;
          msg.value = 'もう一度押すと実行されます';
          clearTimeout(armTimer);
          armTimer = setTimeout(() => { armed.value = null; msg.value = ''; }, 3000);
          return;
        }
        clearTimeout(armTimer);
        armed.value = null;
        action();
      }

      function setSize(n) {
        size.value = n;
        hits.value = 0;
        homeRuns.value = 0;
        msg.value = '';
      }
      function setSpeed(v) {
        speed.value = v;
        storeSpeed(v);
      }

      function incHits() {
        buzz();
        if (hits.value < size.value) hits.value++;
        msg.value = '';
      }
      function decHits() {
        buzz();
        if (hits.value > 0) hits.value--;
        if (homeRuns.value > hits.value) homeRuns.value = hits.value;
        msg.value = '';
      }
      function incHR() {
        buzz();
        if (homeRuns.value < hits.value) homeRuns.value++;
        msg.value = '';
      }
      function decHR() {
        buzz();
        if (homeRuns.value > 0) homeRuns.value--;
        msg.value = '';
      }

      function resetRound() {
        hits.value = 0;
        homeRuns.value = 0;
        note.value = '';
        msg.value = '入力をリセットしました';
      }
      function reset() {
        confirmTap('reset', resetRound);
      }

      async function save() {
        if (!canSave.value) return;
        saving.value = true;
        msg.value = '';
        try {
          const s = rowStats({ pitches: size.value, hits: hits.value, homeRuns: homeRuns.value });
          const row = await Store.add({
            playedAt: new Date().toISOString(),
            pitches: size.value,
            hits: hits.value,
            homeRuns: homeRuns.value,
            rate: s.rate,
            speed: speed.value,
            note: note.value.trim(),
          });
          rounds.value = [row, ...rounds.value];
          hits.value = 0;
          homeRuns.value = 0;
          note.value = '';
          msg.value = '保存しました';
        } catch (e) {
          msg.value = '保存できませんでした。もう一度お試しください';
        } finally {
          saving.value = false;
        }
      }

      async function removeRound(id) {
        try {
          rounds.value = await Store.remove(id);
          msg.value = '記録を削除しました';
        } catch (e) {
          msg.value = '削除できませんでした';
        }
      }
      function deleteRound(id) {
        confirmTap('del-' + id, () => removeRound(id));
      }

      onMounted(async () => {
        try {
          const list = await Store.list();
          rounds.value = list.sort((a, b) => (a.playedAt < b.playedAt ? 1 : -1));
          loadState.value = 'ready';
        } catch (e) {
          loadState.value = 'error';
        }
        // 記録がブラウザに消されにくくする（対応している場合のみ）
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
      });
      onBeforeUnmount(() => clearTimeout(armTimer));

      return {
        tab, size, speed, speeds: SPEEDS, setSpeed, reason, hits, homeRuns, note, rounds, loadState, saving, msg, armed,
        cur, overall, todayTotal, canSave,
        ADVICE, checks, checkDone, checkPct, toggleCheck, resetChecks, ADVICE_TOTAL,
        setSize, incHits, decHits, incHR, decHR, reset, save, deleteRound, fmtDate, rowStats,
      };
    },
    template: `
      <div class="wrap">
        <header class="head">
          <h1>バッティングマシン記録</h1>
          <p class="sub" v-if="tab === 'record'">{{ reason }}。ヒットの数を入れてください</p>
          <p class="sub" v-else>打席の前と、ラウンドの途中で確認してください</p>
        </header>

        <nav class="tabs" role="tablist" aria-label="画面の切り替え">
          <button type="button" role="tab" class="tab" :class="{ on: tab === 'record' }"
            :aria-selected="tab === 'record'" @click="tab = 'record'">記録</button>
          <button type="button" role="tab" class="tab" :class="{ on: tab === 'advice' }"
            :aria-selected="tab === 'advice'" @click="tab = 'advice'">アドバイス</button>
        </nav>

        <!-- 記録タブ -->
        <template v-if="tab === 'record'">
          <section class="card">
            <div class="seg" role="group" aria-label="球数">
              <button v-for="n in [20, 25]" :key="n" type="button"
                class="seg-btn" :class="{ on: size === n }"
                @click="setSize(n)">{{ n }}球</button>
            </div>

            <div class="spd-row">
              <span class="muted">球速（km/h）</span>
              <div class="spd-chips" role="group" aria-label="球速">
                <button v-for="s in speeds" :key="s" type="button" class="spd-btn"
                  :class="{ on: speed === s }" @click="setSpeed(s)">{{ s }}</button>
              </div>
            </div>

            <div class="counters">
              <div class="counter-row">
                <div class="counter-label">
                  <strong>ヒット</strong>
                  <span>{{ size }}球中（ホームランも含む）</span>
                </div>
                <div class="stepper">
                  <button type="button" class="step" aria-label="ヒットを1つ減らす"
                    :disabled="hits === 0" @click="decHits">−</button>
                  <span class="step-v">{{ hits }}</span>
                  <button type="button" class="step plus" aria-label="ヒットを1つ増やす"
                    :disabled="hits >= size" @click="incHits">＋</button>
                </div>
              </div>

              <div class="counter-row">
                <div class="counter-label">
                  <strong>うちホームラン</strong>
                  <span>ヒットの中の本数</span>
                </div>
                <div class="stepper">
                  <button type="button" class="step" aria-label="ホームランを1つ減らす"
                    :disabled="homeRuns === 0" @click="decHR">−</button>
                  <span class="step-v">{{ homeRuns }}</span>
                  <button type="button" class="step plus" aria-label="ホームランを1つ増やす"
                    :disabled="homeRuns >= hits" @click="incHR">＋</button>
                </div>
              </div>
            </div>

            <div class="summary">
              <div class="tile"><div class="stat-v">{{ cur.rate }}%</div><div class="stat-l">ヒット率</div></div>
              <div class="tile"><div class="stat-v">{{ cur.singles }}</div><div class="stat-l">単打</div></div>
              <div class="tile"><div class="stat-v">{{ cur.homeRuns }}</div><div class="stat-l">ホームラン</div></div>
            </div>

            <div class="btn-row">
              <button type="button" class="ghost" :class="{ armed: armed === 'reset' }" @click="reset">
                {{ armed === 'reset' ? 'もう一度押すとリセット' : '入力をリセット' }}
              </button>
            </div>

            <input class="note" v-model="note" maxlength="120"
              placeholder="メモ（任意）例：ストレート、タイミング良し">
            <button type="button" class="save" :disabled="!canSave" @click="save">
              {{ saving ? '保存中…' : size + '球のラウンドを保存' }}
            </button>
            <p class="msg" aria-live="polite">{{ msg }}</p>
          </section>

          <section class="card">
            <div class="list-head">
              <h2>最近のラウンド</h2>
              <span class="muted" v-if="overall.rounds">{{ overall.rounds }}ラウンド・通算ヒット率 {{ overall.rate }}%</span>
            </div>

            <div class="today" v-if="todayTotal.rounds">
              今日：{{ todayTotal.rounds }}ラウンド・{{ todayTotal.hits }}/{{ todayTotal.pitches }}球・ヒット率 {{ todayTotal.rate }}%
            </div>

            <p v-if="loadState === 'loading'" class="muted">読み込み中…</p>
            <p v-else-if="loadState === 'error'" class="muted">記録を読み込めませんでした</p>
            <p v-else-if="!rounds.length" class="empty">
              まだ記録がありません。ラウンドを入力して保存すると、ここに表示されます。
            </p>
            <ul v-else class="list">
              <li v-for="r in rounds" :key="r.id" class="item">
                <div class="item-top">
                  <span>{{ fmtDate(r.playedAt) }}</span>
                  <span class="score">
                    {{ rowStats(r).hits }}/{{ rowStats(r).pitches }}球
                    （HR {{ rowStats(r).homeRuns }}）・{{ rowStats(r).rate }}%
                  </span>
                </div>
                <div class="item-foot">
                  <span class="item-note">{{ r.speed ? r.speed + 'km/h' : '' }}{{ r.speed && r.note ? '・' : '' }}{{ r.note }}</span>
                  <button type="button" class="del" :class="{ armed: armed === 'del-' + r.id }"
                    @click="deleteRound(r.id)">
                    {{ armed === 'del-' + r.id ? 'もう一度で削除' : '削除' }}
                  </button>
                </div>
              </li>
            </ul>

            <p class="store-note" v-if="rounds.length">
              記録はこの端末のブラウザに保存されています。
            </p>
          </section>
        </template>

        <!-- アドバイスタブ -->
        <template v-else>
          <section class="card">
            <div class="progress">
              <div class="progress-row">
                <span>確認済み</span>
                <span class="count">{{ checkDone }} / {{ ADVICE_TOTAL }}</span>
              </div>
              <div class="bar"><div class="bar-fill" :style="{ width: checkPct + '%' }"></div></div>
            </div>
          </section>

          <section class="card" v-for="g in ADVICE" :key="g.title">
            <div class="card-head">
              <h2>{{ g.title }}</h2>
              <span class="tag">{{ g.tag }}</span>
            </div>
            <label v-for="it in g.items" :key="it.k" class="adv-item">
              <input type="checkbox" :checked="!!checks[it.k]" @change="toggleCheck(it.k)">
              <div>
                <div class="t">{{ it.t }}</div>
                <div class="d">{{ it.d }}</div>
              </div>
            </label>
          </section>

          <section class="card">
            <div class="point">
              <strong>握りは指、力は抜く、手は肩の高さ。</strong>
              この3つを打席の前に確認します。
            </div>
            <div class="warn">
              <strong>注意：</strong>
              この内容は、初心者向けの動画の説明を要約したものです。実際の指導は、コーチや指導者の指示を優先してください。
            </div>
            <p class="src">出典：「元プロ野球選手による超初心者向けのバッティング講座」（動画の字幕から要点をまとめました）</p>
            <div class="btn-row">
              <button type="button" class="ghost" :class="{ armed: armed === 'advice-reset' }"
                @click="confirmTap('advice-reset', resetChecks)">
                {{ armed === 'advice-reset' ? 'もう一度押すとリセット' : 'チェックをリセット' }}
              </button>
            </div>
            <p class="msg" aria-live="polite">{{ msg }}</p>
          </section>
        </template>
      </div>
    `,
  }).mount('#app');
</script>
</body>
</html>
